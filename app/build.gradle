plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nihalthakral.nihalhome'
    compileSdk 34

    defaultConfig {
        applicationId "com.nihalthakral.nihalhome"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "4.0"
    }

    signingConfigs {
        debug {
            storeFile file("../keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.gms:play-services-ads:23.5.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Mediation adapters (fixes "Adapter Not found / SDK Not ready" in Ad Inspector)
    implementation 'com.google.ads.mediation:applovin:13.6.4.0'
    implementation 'com.google.ads.mediation:vungle:7.7.0.1' // Vungle SDK = Liftoff Monetize
    // NOTE: AdColony intentionally NOT added — Google deprecated it (no longer supported).
    // Recommendation: remove AdColony from your AdMob mediation groups in the console too.
}
