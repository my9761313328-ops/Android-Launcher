<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Image Viewer</title>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #242C3F;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .stage {
    position: fixed;
    top: 0; left: 0; right: 0;
    bottom: 15vw;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  }
  .stage img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    transform: scale(1);
    transform-origin: center center;
    transition: transform 0.2s ease;
    will-change: transform;
  }
  .nav-btn {
    position: fixed;
    bottom: max(4vw, env(safe-area-inset-bottom));
    padding: 2.5vw 5.5vw;
    border-radius: 5vw;
    background: #7ED3FC;
    color: #242C3F;
    border: none;
    outline: none;
    font-size: 3.5vw;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    z-index: 10;
    box-shadow: 0 0.5vw 2vw rgba(0,0,0,0.3);
    transition: transform 0.15s ease, opacity 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
  }
  .nav-btn:focus { outline: none; background: #7ED3FC; }
  .nav-btn:active { transform: scale(0.94); background: #7ED3FC; }
  .nav-btn.disabled { opacity: 0.3; pointer-events: none; animation: none; box-shadow: 0 0.5vw 2vw rgba(0,0,0,0.3); }
  #prevBtn { left: max(4vw, env(safe-area-inset-left)); }
  #nextBtn { right: max(4vw, env(safe-area-inset-right)); }

  .nav-btn.attn {
    animation: attnPulse 1.4s ease-in-out infinite;
  }
  @keyframes attnPulse {
    0%   { transform: scale(1);    box-shadow: 0 0.5vw 2vw rgba(0,0,0,0.3), 0 0 0 0 rgba(126,211,252,0.7); }
    50%  { transform: scale(1.08); box-shadow: 0 0.5vw 2vw rgba(0,0,0,0.3), 0 0 0 3vw rgba(126,211,252,0); }
    100% { transform: scale(1);    box-shadow: 0 0.5vw 2vw rgba(0,0,0,0.3), 0 0 0 0 rgba(126,211,252,0); }
  }
  .nav-btn.attn:active { animation: none; }
  .counter {
    position: fixed;
    bottom: max(5vw, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    color: #7ED3FC;
    font-size: 3.2vw;
    opacity: 0.8;
    z-index: 10;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="stage">
  <img id="viewerImg" src="images/1.gif" alt="image">
</div>

<button class="nav-btn disabled" id="prevBtn" aria-label="Previous">Previous</button>
<button class="nav-btn attn" id="nextBtn" aria-label="Next">Next</button>
<div class="counter" id="counter">1 / 4</div>

<script>
  const images = ["images/1.jpg", "images/2.jpg", "images/3.png", "images/4.jpg", "images/5.jpg"];
  let index = 0;

  const imgEl = document.getElementById('viewerImg');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const counter = document.getElementById('counter');
  const stage = document.querySelector('.stage');

  // ---- Restrict right-click, selection, dragging everywhere ----
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());

  // ---- Zoom + Pan logic (pinch/double-tap zoom, drag to pan when zoomed) ----
  const MIN_SCALE = 1;
  const MAX_SCALE = 4;
  let scale = 1;
  let panX = 0, panY = 0;
  let pinchStartDist = null;
  let pinchStartScale = 1;
  let pinchStartPan = { x: 0, y: 0 };
  let pinchMidStart = null;

  function clampPan() {
    const stageRect = stage.getBoundingClientRect();
    const imgRect = imgEl.getBoundingClientRect();
    // natural (unscaled) rendered size
    const baseW = imgRect.width / scale;
    const baseH = imgRect.height / scale;
    const maxX = Math.max(0, (baseW * scale - stageRect.width) / 2);
    const maxY = Math.max(0, (baseH * scale - stageRect.height) / 2);
    panX = Math.max(-maxX, Math.min(maxX, panX));
    panY = Math.max(-maxY, Math.min(maxY, panY));
  }

  function applyTransform(withTransition) {
    imgEl.style.transition = withTransition ? 'transform 0.2s ease' : 'none';
    imgEl.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
  }

  function resetZoom() {
    scale = 1; panX = 0; panY = 0;
    applyTransform(true);
  }

  function dist(t1, t2) {
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function mid(t1, t2) {
    return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
  }

  // Single-finger pan (only active when zoomed)
  let panStart = null;
  let panOrigin = null;

  stage.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      pinchStartDist = dist(e.touches[0], e.touches[1]);
      pinchStartScale = scale;
      pinchStartPan = { x: panX, y: panY };
      pinchMidStart = mid(e.touches[0], e.touches[1]);
      panStart = null;
    } else if (e.touches.length === 1 && scale > 1) {
      panStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      panOrigin = { x: panX, y: panY };
    }
  }, { passive: true });

  stage.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchStartDist) {
      e.preventDefault();
      const newDist = dist(e.touches[0], e.touches[1]);
      let newScale = pinchStartScale * (newDist / pinchStartDist);
      newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
      scale = newScale;
      panX = pinchStartPan.x;
      panY = pinchStartPan.y;
      clampPan();
      applyTransform(false);
    } else if (e.touches.length === 1 && panStart) {
      e.preventDefault();
      panX = panOrigin.x + (e.touches[0].clientX - panStart.x);
      panY = panOrigin.y + (e.touches[0].clientY - panStart.y);
      clampPan();
      applyTransform(false);
    }
  }, { passive: false });

  stage.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) { pinchStartDist = null; }
    if (e.touches.length === 0) {
      panStart = null;
      clampPan();
      applyTransform(true);
      if (scale <= 1) { scale = 1; panX = 0; panY = 0; applyTransform(true); }
    }
  });

  // Double-tap to toggle zoom (mobile) and double-click (desktop)
  let lastTap = 0;
  function handleDoubleTap() {
    if (scale > 1) {
      scale = 1; panX = 0; panY = 0;
    } else {
      scale = 2;
    }
    applyTransform(true);
  }
  stage.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTap < 300 && e.touches.length === 0) {
      handleDoubleTap();
    }
    lastTap = now;
  });
  stage.addEventListener('dblclick', handleDoubleTap);

  // Mouse wheel zoom (desktop convenience)
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    let newScale = scale + (e.deltaY < 0 ? 0.2 : -0.2);
    scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
    if (scale <= 1) { scale = 1; panX = 0; panY = 0; }
    clampPan();
    applyTransform(true);
  }, { passive: false });

  // Mouse drag to pan when zoomed (desktop)
  let mouseDragging = false;
  let mouseStart = null;
  let mousePanOrigin = null;
  stage.addEventListener('mousedown', (e) => {
    if (scale > 1) {
      mouseDragging = true;
      mouseStart = { x: e.clientX, y: e.clientY };
      mousePanOrigin = { x: panX, y: panY };
    }
  });
  window.addEventListener('mousemove', (e) => {
    if (mouseDragging) {
      panX = mousePanOrigin.x + (e.clientX - mouseStart.x);
      panY = mousePanOrigin.y + (e.clientY - mouseStart.y);
      clampPan();
      applyTransform(false);
    }
  });
  window.addEventListener('mouseup', () => {
    if (mouseDragging) {
      mouseDragging = false;
      clampPan();
      applyTransform(true);
    }
  });

  function render() {
    imgEl.src = images[index];
    counter.textContent = (index + 1) + " / " + images.length;
    prevBtn.classList.toggle('disabled', index === 0);
    const isLast = index === images.length - 1;
    nextBtn.classList.toggle('disabled', isLast);
    nextBtn.classList.toggle('attn', !isLast);
    resetZoom();
  }

  prevBtn.addEventListener('click', () => {
    if (index > 0) { index--; render(); }
  });

  nextBtn.addEventListener('click', () => {
    if (index < images.length - 1) { index++; render(); }
  });

  render();
</script>

</body>
</html>
