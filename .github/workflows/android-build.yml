name: Android Build

# Sirf manual trigger — Actions tab me jaake "Run workflow" dabane par hi chalega.
# Koi push/pull_request trigger nahi hai, isliye upload/commit karne par apne aap nahi chalega.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Project me gradlew script/wrapper jar nahi hai, isliye Gradle
      # is action se seedha install ho raha hai (gradlew ki zarurat nahi).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
